name: NORVA site audit screenshots
on:
  push:
    branches:
      - audit/site-quality-2026-11-25
      - redesign/norva-world-v1
      - redesign/deep-water-gallery-v2
    paths:
      - ".github/workflows/site-audit.yml"
      - "audit/**"
      - "*.html"
      - "*.css"
      - "**/*.css"
      - "assets/**"
      - "*.js"
      - "**/*.js"
      - "engine/**"
  workflow_dispatch:
concurrency:
  group: norva-site-audit-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/norva-http.log 2>&1 &
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
      - name: Audit pages and capture screenshots
        run: |
          mkdir -p audit-output/screenshots
          cat > audit-run.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const pages = [
            'index.html','studio.html','works.html','experiments.html','products.html','archive.html','contact.html',
            'photography.html','documentary.html','antmonologue.html',
            'experiment-water.html','experiment-tide.html','experiment-sound.html','experiment-field.html',
            'product-content-engine.html','product-document-converter.html','product-video-engine.html','product-hmc-mind.html',
            'service-short-video.html','service-long-video.html','service-course-video.html','service-subtitles.html','service-ai-voice.html','service-audio-post.html'
          ];
          const browser = await chromium.launch({headless:true});
          const report = {base:'http://127.0.0.1:4173/', pages:[], brokenLinks:[]};
          for (const path of pages) {
            const item = {path, title:'', viewports:[], pageErrors:[], consoleErrors:[], failedRequests:[]};
            const page = await browser.newPage({deviceScaleFactor:1});
            page.on('pageerror', e => item.pageErrors.push(String(e)));
            page.on('console', m => { if(m.type()==='error') item.consoleErrors.push(m.text()); });
            page.on('requestfailed', r => { const error=r.failure()?.errorText; if(error!=='net::ERR_ABORTED') item.failedRequests.push({url:r.url(),error}); });
            for (const width of [1440,768,390]) {
              await page.setViewportSize({width,height:900});
              const url = report.base + path;
              try {
                await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
                await page.waitForTimeout(700);
                const navCount=await page.locator('.nav a').count();
                if(path!=='index.html'&&navCount!==5) item.pageErrors.push('Interior navigation must contain exactly five rooms: '+navCount);
                if(path==='index.html'&&navCount!==0) item.pageErrors.push('Homepage must not show top navigation: '+navCount);
                const brandHome=await page.locator('.brand[href="index.html"]').count();
                if(path!=='index.html'&&brandHome!==1) item.pageErrors.push('Brand mark must link to homepage: '+brandHome);
                if(path==='index.html') {
                  const homeState=await page.evaluate(()=>({
                    height:document.documentElement.scrollHeight,
                    viewport:innerHeight,
                    onethingTitle:document.querySelector('[data-one-title]')?.textContent.trim()||'',
                    onethingReveal:document.querySelector('[data-one-reveal]')?.textContent.trim()||'',
                    onethingMeaning:document.querySelector('[data-one-meaning]')?.textContent.trim()||'',
                    onethingLinks:document.querySelectorAll('[data-onething] a').length,
                    topMenu:!!document.querySelector('.menu-button'),
                    canvas:!!document.querySelector('#waterCanvas'),
                    canvasRect:(()=>{const r=document.querySelector('#waterCanvas')?.getBoundingClientRect();return r?{width:r.width,height:r.height}:null})(),
                    starNodes:document.querySelectorAll('[data-star-room]').length,
                    starHitWidths:Array.from(document.querySelectorAll('.star-node circle.hit')).map(el=>el.getBoundingClientRect().width),
                    oneThing:!!document.querySelector('[data-onething]'),
                    externalFonts:performance.getEntriesByType('resource').filter(x=>/fonts\.(googleapis|gstatic)\.com/i.test(x.name)).map(x=>x.name)
                  }));
                  if(homeState.height>homeState.viewport+1) item.pageErrors.push('Homepage should fit one viewport: '+JSON.stringify(homeState));
                  if(!homeState.canvas || !homeState.canvasRect || homeState.canvasRect.width<100 || homeState.canvasRect.height<100) item.pageErrors.push('Homepage water canvas is missing or has no dimensions: '+JSON.stringify(homeState));
                  if(homeState.starNodes!==5) item.pageErrors.push('Homepage must contain five direct star-map links: '+homeState.starNodes);
                  if(homeState.starHitWidths.some(w=>w<44)) item.pageErrors.push('Star map touch target is smaller than 44px: '+JSON.stringify(homeState.starHitWidths));
                  if(!homeState.oneThing) item.pageErrors.push('Homepage ONETHING module is missing');
                  if(!homeState.onethingTitle||!homeState.onethingReveal||!homeState.onethingMeaning) item.pageErrors.push('ONETHING full daily content is incomplete');
                  if(homeState.onethingLinks!==0) item.pageErrors.push('ONETHING must not link to a separate page');
                  await page.locator('#waterCanvas').dispatchEvent('pointerdown',{clientX:width/2,clientY:450});
                  await page.waitForTimeout(100);
                  const rippleState=await page.evaluate(()=>({count:Number(document.querySelector('#waterCanvas')?.dataset.rippleCount||0),keywordVisible:document.querySelector('[data-onething-keyword]')?.hidden===false}));
                  if(rippleState.count<1||!rippleState.keywordVisible) item.pageErrors.push('Homepage ripple writing interaction failed: '+JSON.stringify(rippleState));
                  if(homeState.topMenu) item.pageErrors.push('Homepage must not display a top menu');
                  if(homeState.externalFonts.length) item.pageErrors.push('External font requests detected: '+JSON.stringify(homeState.externalFonts));
                }
                if(width===390) {
                  const menu=page.locator('.menu-button');
                  if(await menu.count()) {
                    await menu.click();
                    const opened=await menu.getAttribute('aria-expanded')==='true' && await page.locator('.nav').evaluate(el=>el.classList.contains('open'));
                    if(!opened) item.pageErrors.push('Mobile navigation failed to open');
                    await menu.click();
                    const closed=await menu.getAttribute('aria-expanded')==='false' && !(await page.locator('.nav').evaluate(el=>el.classList.contains('open')));
                    if(!closed) item.pageErrors.push('Mobile navigation failed to close');
                  }
                }
                const state = await page.evaluate(() => ({
                  title:document.title, lang:document.documentElement.lang,
                  viewport:document.querySelector('meta[name="viewport"]')?.content || null,
                  h1:document.querySelectorAll('h1').length, main:document.querySelectorAll('main').length,
                  width:innerWidth, scrollWidth:document.documentElement.scrollWidth,
                  bodyWidth:document.body.scrollWidth, height:document.documentElement.scrollHeight,
                  fontRequests:performance.getEntriesByType('resource').filter(x=>/fonts\.(googleapis|gstatic)\.com/i.test(x.name)).map(x=>x.name),
                  canonical:document.querySelector('link[rel=canonical]')?.href||null,
                  pageTitleSize:(()=>{const el=document.querySelector('.page-title');return el?parseFloat(getComputedStyle(el).fontSize):null})(),
                  overflowNodes:Array.from(document.querySelectorAll('body *')).map(el=>{
                    const r=el.getBoundingClientRect(),s=getComputedStyle(el);
                    return {tag:el.tagName,cls:typeof el.className==='string'?el.className:'',id:el.id,left:Math.round(r.left),right:Math.round(r.right),width:Math.round(r.width),position:s.position};
                  }).filter(x=>x.right>innerWidth+1||x.left < -1).slice(0,20),
                  images:Array.from(document.images).map(img=>({src:img.currentSrc||img.src,loaded:img.complete&&img.naturalWidth>0,naturalWidth:img.naturalWidth,alt:img.alt})),
                  media:Array.from(document.querySelectorAll('video,iframe')).map(el=>({tag:el.tagName,src:el.currentSrc||el.querySelector('source')?.src||el.src||el.getAttribute('src')||'',poster:el.poster||'',readyState:el.readyState??null,error:el.error?.code??null,title:el.title||''}))
                }));
                item.title = state.title;
                if(state.fontRequests.length) item.pageErrors.push('External font requests: '+JSON.stringify(state.fontRequests));
                if(state.pageTitleSize!==null&&state.pageTitleSize>28.5) item.pageErrors.push('Page title exceeds 28px: '+state.pageTitleSize);
                const bodyText=await page.locator('body').innerText();
                if(/SUMERU|须弥山|¥|￥|RMB|CNY|价格|报价|收费/.test(bodyText)) item.pageErrors.push('Forbidden brand or price text detected');
                if(path!=='index.html'&&await page.locator('.next-page a[href]').count()===0) item.pageErrors.push('Missing next-page destination');
                if(path==='contact.html'&&(!bodyText.includes('tbmax.in@hotmail.com')||!bodyText.includes('HMC-NORVA'))) item.pageErrors.push('Contact page is missing the approved email or WeChat ID');
                item.viewports.push({...state,horizontalOverflow:state.scrollWidth>state.width+1 || state.bodyWidth>state.width+1});
                if(width===1440 && path==='experiment-water.html') {
                  await page.locator('[data-breath] button').click();
                  const breathOn=await page.locator('.breath-orb').evaluate(el=>el.classList.contains('active'));
                  const breathLabel=await page.locator('[data-breath-label]').innerText();
                  await page.locator('[data-breath] button').click();
                  if(!breathOn||!breathLabel.includes('吸气')) item.pageErrors.push('4/6 breathing interaction failed');
                  await page.locator('[data-water-tone]').first().click();
                  const tone=await page.locator('[data-play-canvas]').getAttribute('data-current-tone');
                  if(tone!=='#8fd8cd') item.pageErrors.push('Local water tone control failed: '+tone);
                }
                if(width===1440) {
                  const playback = await page.evaluate(async () => {
                    const results=[];
                    for (const video of document.querySelectorAll('video')) {
                      video.muted=true;
                      try {
                        await Promise.race([
                          video.play(),
                          new Promise((_,reject)=>setTimeout(()=>reject(new Error('play timeout')),5000))
                        ]);
                        await new Promise(resolve=>setTimeout(resolve,1400));
                        results.push({src:video.currentSrc||video.querySelector('source')?.src||'',currentTime:Number(video.currentTime.toFixed(2)),paused:video.paused,readyState:video.readyState,error:video.error?.code??null});
                      } catch(error) {
                        results.push({src:video.currentSrc||video.querySelector('source')?.src||'',playError:String(error),readyState:video.readyState,error:video.error?.code??null});
                      }
                      video.pause();
                    }
                    return results;
                  });
                  item.viewports[item.viewports.length-1].playback=playback;
                }
                if(width===1440 || width===390) {
                  await page.evaluate(async () => {
                    const imgs=Array.from(document.images);
                    for(const img of imgs) {
                      img.loading='eager';
                      try { await img.decode(); } catch {}
                    }
                    window.scrollTo(0,document.body.scrollHeight);
                    await new Promise(resolve=>setTimeout(resolve,350));
                    window.scrollTo(0,0);
                    await new Promise(resolve=>setTimeout(resolve,350));
                  });
                  const imageFailures=await page.evaluate(()=>Array.from(document.images).filter(img=>!img.complete||img.naturalWidth===0).map(img=>({url:img.currentSrc||img.src,error:'image failed to load'})));
                  for(const failure of imageFailures) item.failedRequests.push(failure);
                  await page.screenshot({path:'audit-output/screenshots/'+path.replace('.html','')+'-'+width+'.png',fullPage:true,animations:'disabled'});
                }
                if(width===1440 && path==='index.html') {
                  const expected=['studio','works','experiments','products','contact'];
                  const actual=await page.locator('[data-star-room]').evaluateAll(nodes=>nodes.map(n=>n.dataset.starRoom));
                  if(expected.some(x=>!actual.includes(x))||actual.length!==5) item.pageErrors.push('Star map destinations mismatch: '+JSON.stringify(actual));
                }
                if(width===1440) {
                  const links = await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.getAttribute('href')).filter(Boolean));
                  for(const href of new Set(links)) {
                    if(href.startsWith('mailto:')||href.startsWith('tel:')||href.startsWith('javascript:')) continue;
                    const target = new URL(href,url);
                    if(target.origin!==new URL(url).origin) continue;
                    const targetPath = target.pathname.endsWith('/') ? target.pathname+'index.html' : target.pathname;
                    const response = await page.request.get(target.origin+targetPath,{timeout:15000}).catch(()=>null);
                    if(!response || !response.ok()) report.brokenLinks.push({from:path,href,status:response?.status()??'request failed'});
                    else if(target.hash) {
                      const html = await response.text(), id = decodeURIComponent(target.hash.slice(1));
                      if(!html.includes('id="'+id+'"')&&!html.includes("id='"+id+"'")&&!html.includes('name="'+id+'"')&&!html.includes("name='"+id+"'")) report.brokenLinks.push({from:path,href,status:'missing anchor'});
                    }
                  }
                }
              } catch(e) { item.pageErrors.push('Navigation '+width+': '+String(e)); }
            }
            await page.close(); report.pages.push(item);
          }
          await browser.close();
          fs.writeFileSync('audit-output/report.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({pages:report.pages.map(p=>({path:p.path,title:p.title,overflow:p.viewports.filter(v=>v.horizontalOverflow).map(v=>({width:v.width,nodes:v.overflowNodes})),pageErrors:p.pageErrors,consoleErrors:p.consoleErrors,failedRequests:p.failedRequests,images:p.viewports[0]?.images??[],media:p.viewports[0]?.media??[]})),brokenLinks:report.brokenLinks},null,2));
          if(report.brokenLinks.length || report.pages.some(p=>p.pageErrors.length || p.consoleErrors.length || p.failedRequests.length || p.viewports.some(v=>v.horizontalOverflow))) process.exitCode=1;
          EOF
          node audit-run.mjs
      - name: Upload audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norva-site-audit
          path: audit-output/
          retention-days: 7
