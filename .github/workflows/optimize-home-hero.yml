name: Optimize homepage hero image

on:
  push:
    branches: [main]
    paths:
      - "assets/images/home/hero.webp"
      - "styles.css"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install WebP tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Resize and compress hero image
        run: |
          mkdir -p /tmp/norva-image
          cwebp -quiet -mt -m 6 -q 78 -sharp_yuv -resize 2200 0 assets/images/home/hero.webp -o /tmp/norva-image/hero.webp
          echo "Before: $(wc -c < assets/images/home/hero.webp) bytes"
          echo "After:  $(wc -c < /tmp/norva-image/hero.webp) bytes"
          mv /tmp/norva-image/hero.webp assets/images/home/hero.webp
      - name: Commit optimized image when changed
        run: |
          if git diff --quiet -- assets/images/home/hero.webp; then
            echo "Image already optimized; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/home/hero.webp
          git commit -m "Optimize homepage hero image for web"
          git push origin HEAD:main
