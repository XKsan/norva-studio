name: NORVA production website audit
on:
  workflow_run:
    workflows: ["Deploy NORVA STUDIO"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  live-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Audit the public production website
        env:
          LIVE_BASE: https://xksan.github.io/norva-studio/
        run: |
          mkdir -p live-audit/screenshots
          cat > live-audit.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const base = process.env.LIVE_BASE;
          const routes = [
            'index.html','studio.html','works.html','experiments.html','products.html','archive.html','contact.html',
            'photography.html','documentary.html','antmonologue.html',
            'experiment-water.html','experiment-tide.html','experiment-sound.html','experiment-field.html',
            'product-content-engine.html','product-document-converter.html','product-video-engine.html','product-hmc-mind.html',
            'service-short-video.html','service-long-video.html','service-course-video.html',
            'service-subtitles.html','service-ai-voice.html','service-audio-post.html'
          ];
          const widths = [1440,768,600,390];
          const report = {target:base, checkedAt:new Date().toISOString(), routes:[], brokenLinks:[], deployment:{}, sitemap:{}, summary:{}};
          const browser = await chromium.launch({headless:true,args:['--use-fake-device-for-media-stream','--use-fake-ui-for-media-stream']});
          const checkedLinks = new Set();
          const root = await browser.newPage();
          const rootResponse = await root.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
          report.deployment = {
            status:rootResponse?.status() ?? null,
            finalUrl:root.url(),
            title:await root.title(),
            h1:await root.locator('h1').count(),
            main:await root.locator('main').count(),
            pageHeight:await root.evaluate(()=>document.documentElement.scrollHeight),
            viewportHeight:await root.evaluate(()=>innerHeight),
            horizontalWidth:await root.evaluate(()=>document.documentElement.scrollWidth)
          };
          const sitemapResponse=await root.request.get(new URL('sitemap.xml',base).href).catch(()=>null);
          const sitemapText=sitemapResponse&&sitemapResponse.ok()?await sitemapResponse.text():'';
          report.sitemap={status:sitemapResponse?.status()??null,urls:[...sitemapText.matchAll(/<loc>(.*?)<\/loc>/g)].map(m=>m[1])};
          await root.close();
          for (const route of routes) {
            const item={route,title:'',status:null,viewports:[],pageErrors:[],consoleErrors:[],failedRequests:[],mobileMenu:null};
            const page=await browser.newPage({deviceScaleFactor:1});
            page.on('pageerror',e=>item.pageErrors.push(String(e)));
            page.on('console',m=>{if(m.type()==='error')item.consoleErrors.push(m.text())});
            page.on('requestfailed',r=>{const e=r.failure()?.errorText;if(e!=='net::ERR_ABORTED')item.failedRequests.push({url:r.url(),error:e})});
            for (const width of widths) {
              await page.setViewportSize({width,height:900});
              try {
                const response=await page.goto(new URL(route,base).href,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(900);
                const state=await page.evaluate((route)=>({
                  title:document.title,lang:document.documentElement.lang,status:document.readyState,
                  width:innerWidth,scrollWidth:document.documentElement.scrollWidth,
                  bodyWidth:document.body.scrollWidth,height:document.documentElement.scrollHeight,
                  h1:document.querySelectorAll('h1').length,main:document.querySelectorAll('main').length,
                  fontRequests:performance.getEntriesByType('resource').filter(x=>/fonts\.(googleapis|gstatic)\.com/i.test(x.name)).map(x=>x.name),
                  canonical:document.querySelector('link[rel=canonical]')?.href||null,
                  pageTitleSize:(()=>{const el=document.querySelector('.page-title');return el?parseFloat(getComputedStyle(el).fontSize):null})(),
                  navCount:document.querySelectorAll('.nav a').length,
                  brandHome:document.querySelectorAll('.brand[href="index.html"]').length,
                  nextCount:document.querySelectorAll('.next-page a[href]').length,
                  bodyText:document.body.innerText,
                  waterCanvas:!!document.querySelector('#waterCanvas'),
                  topMenu:!!document.querySelector('.menu-button'),
                  starNodes:document.querySelectorAll('[data-star-room]').length,
                  starHitWidths:[...document.querySelectorAll('.star-node circle.hit')].map(el=>el.getBoundingClientRect().width),
                  oneThing:!!document.querySelector('[data-onething]'),
                  oneThingTitle:document.querySelector('[data-one-title-en]')?.textContent.trim()||'',
                  oneThingTitleZh:document.querySelector('[data-one-title-zh]')?.textContent.trim()||'',
                  oneThingReveal:document.querySelector('[data-one-reveal-en]')?.textContent.trim()||'',
                  oneThingRevealZh:document.querySelector('[data-one-reveal-zh]')?.textContent.trim()||'',
                  oneThingMeaning:document.querySelector('[data-one-meaning-en]')?.textContent.trim()||'',
                  oneThingMeaningZh:document.querySelector('[data-one-meaning-zh]')?.textContent.trim()||'',
                  oneThingLinks:document.querySelectorAll('[data-onething] a').length,
                  overflowNodes:[...document.querySelectorAll('body *')].map(el=>{const r=el.getBoundingClientRect();return {tag:el.tagName,cls:typeof el.className==='string'?el.className:'',id:el.id,left:Math.round(r.left),right:Math.round(r.right)}}).filter(x=>x.right>innerWidth+1||x.left < -1).slice(0,12),
                  images:[...document.images].map(i=>({src:i.currentSrc||i.src,loaded:i.complete&&i.naturalWidth>0,width:i.naturalWidth,alt:i.alt})),
                  videos:[...document.querySelectorAll('video')].map(v=>({src:v.currentSrc||v.querySelector('source')?.src||'',readyState:v.readyState,error:v.error?.code??null})),
                  floatingPageNav:(()=>{const nav=document.querySelector('.floating-page-nav');return {present:!!nav,back:!!nav?.querySelector('[data-page-back]'),forward:!!nav?.querySelector('[data-page-forward]'),home:nav?.querySelector('[data-page-home]')?.getAttribute('href')==='index.html',iconOnly:!!nav&&[...nav.children].map(el=>el.textContent.trim()).join('|')==='←|→|🏠'}})(),
                  studioGrid:(()=>{const grid=document.querySelector('body.studio-page .content-grid');const last=grid?.lastElementChild;return grid&&last?{columns:getComputedStyle(grid).gridTemplateColumns.split(' ').length,lastColumnEnd:getComputedStyle(last).gridColumnEnd}:null})(),
                  orphanGuards:route==='archive.html'?document.querySelectorAll('.page-desc .keep-together').length:route==='contact.html'?document.querySelectorAll('.page-desc .keep-together,.section-intro .keep-together').length:null,
                  antImageFit:(()=>{const img=document.querySelector('.antmonologue-visual img');return img?{objectFit:getComputedStyle(img).objectFit,frameRatio:img.parentElement.getBoundingClientRect().width/img.parentElement.getBoundingClientRect().height,frameWidth:img.parentElement.getBoundingClientRect().width,naturalWidth:img.naturalWidth,naturalHeight:img.naturalHeight}:null})(),
                  onethingSpacing:(()=>{const root=document.querySelector('[data-onething]');if(!root)return null;const margin=(s,side)=>{const el=root.querySelector(s);return el?parseFloat(getComputedStyle(el)[side])||0:null};return {category:margin('.category','marginBottom'),titleEn:margin('.one-bilingual h2:first-child','marginBottom'),titleZh:margin('.one-bilingual h2:nth-child(2)','marginBottom'),revealEn:margin('.reveal[data-one-reveal-en]','marginTop'),revealZh:margin('.reveal[data-one-reveal-zh]','marginTop'),meaningEn:margin('.meaning[data-one-meaning-en]','marginTop'),meaningZh:margin('.meaning[data-one-meaning-zh]','marginTop')}})(),
                }),route);
                if(width===1440){item.title=state.title;item.status=response?.status()??null}
                const imageFailures=state.images.filter(i=>!i.loaded);
                if(state.fontRequests.length)item.pageErrors.push('External font requests: '+JSON.stringify(state.fontRequests));
                if(state.h1!==1||state.main!==1||state.lang!=='zh-CN')item.pageErrors.push('Page structure or language metadata is invalid');
                if(/SUMERU|须弥山|¥|￥|RMB|CNY|价格|报价|收费/.test(state.bodyText))item.pageErrors.push('Forbidden brand or price text detected');
                if(route!=='index.html'&&state.navCount!==5)item.pageErrors.push('Interior navigation count is not five: '+state.navCount);
                if(route!=='index.html'&&state.brandHome!==1)item.pageErrors.push('Brand mark does not link to homepage');
                if(route!=='index.html'&&state.nextCount<1&&!state.floatingPageNav?.forward)item.pageErrors.push('Missing next-page destination or floating forward control');
                if(route!=='index.html'&&(!state.floatingPageNav?.present||!state.floatingPageNav.back||!state.floatingPageNav.forward||!state.floatingPageNav.home||!state.floatingPageNav.iconOnly))item.pageErrors.push('Floating icon navigation is missing or invalid: '+JSON.stringify(state.floatingPageNav));
                if(route==='archive.html'&&state.orphanGuards!==1)item.pageErrors.push('Archive page orphan-line guard is missing');
                if(route==='contact.html'&&state.orphanGuards!==2)item.pageErrors.push('Contact page orphan-line guards are incomplete');
                if(route==='studio.html'&&width===600&&state.studioGrid?.lastColumnEnd!=='-1')item.pageErrors.push('Studio third panel does not fill the tablet grid row: '+JSON.stringify(state.studioGrid));
                if(route==='antmonologue.html'&&(!state.antImageFit||state.antImageFit.objectFit!=='contain'||state.antImageFit.frameWidth>421||state.antImageFit.naturalWidth<1||state.antImageFit.naturalHeight<1))item.pageErrors.push('Antmonologue image must fit without cropping: '+JSON.stringify(state.antImageFit));
                
                if(route==='index.html'){const spacingMin=width<=520?7:6;if(!state.onethingSpacing||Object.values(state.onethingSpacing).some(v=>v===null||v<spacingMin))item.pageErrors.push('ONETHING vertical spacing is below the '+(width<=520?'mobile':'desktop')+' accepted minimum ('+spacingMin+'px): '+JSON.stringify(state.onethingSpacing));}
                if(state.pageTitleSize!==null&&state.pageTitleSize>28.5)item.pageErrors.push('Page title exceeds 28px: '+state.pageTitleSize);
                const expectedCanonical=route==='index.html'?base:new URL(route,base).href;
                if(state.canonical!==expectedCanonical)item.pageErrors.push('Canonical mismatch: '+state.canonical);
                if(route==='contact.html'&&(!state.bodyText.includes('tbmax.in@hotmail.com')||!state.bodyText.includes('HMC-NORVA')))item.pageErrors.push('Contact details missing');
                if(route==='index.html'){
                  if(state.navCount!==0||state.topMenu)item.pageErrors.push('Homepage must not show a top menu');
                  if(!state.waterCanvas||state.starNodes!==5||!state.oneThing||!state.oneThingTitle||!state.oneThingTitleZh||!state.oneThingReveal||!state.oneThingRevealZh||!state.oneThingMeaning||!state.oneThingMeaningZh||state.oneThingLinks!==0)item.pageErrors.push('Homepage water, star map or bilingual ONETHING structure is incomplete');
                  if(state.starHitWidths.some(w=>w<44))item.pageErrors.push('Star map touch target smaller than 44px: '+JSON.stringify(state.starHitWidths));
                }
                item.viewports.push({...state,httpStatus:response?.status()??null,horizontalOverflow:state.scrollWidth>width+1||state.bodyWidth>width+1,imageFailures});
                if(width===1440 && route==='index.html'){
                  await page.locator('#waterCanvas').dispatchEvent('pointerdown',{clientX:width/2,clientY:450});
                  await page.waitForTimeout(100);
                  const ripple=await page.evaluate(()=>Number(document.querySelector('#waterCanvas')?.dataset.rippleCount||0));
                  if(ripple<1)item.pageErrors.push('Homepage water ripple interaction failed: no ripple was registered');
                  await page.locator('[data-water-sound]').click();const soundOn=await page.locator('[data-water-sound]').innerText();await page.locator('[data-water-sound]').click();if(soundOn!=='水声 · ON')item.pageErrors.push('Homepage water sound switch failed');
                }
                if(width===1440 && route==='experiment-sound.html'){
                  await page.context().grantPermissions(['microphone'],{origin:new URL(base).origin});
                  const micButton=page.locator('[data-mic-start]');
                  await micButton.click();
                  await page.waitForFunction(()=>document.querySelector('[data-mic-status]')?.textContent.includes('正在读取声音'),null,{timeout:10000}).catch(()=>{});
                  const micState=await page.evaluate(()=>({button:document.querySelector('[data-mic-start]')?.textContent.trim(),status:document.querySelector('[data-mic-status]')?.textContent.trim(),canvasWidth:document.querySelector('[data-mic-canvas]')?.width||0,canvasHeight:document.querySelector('[data-mic-canvas]')?.height||0}));
                  if(micState.button!=='关闭麦克风'||!micState.status?.includes('正在读取声音')||micState.canvasWidth<1||micState.canvasHeight<1)item.pageErrors.push('Sound topography microphone interaction failed: '+JSON.stringify(micState));
                  else {await micButton.click();const stopped=await page.locator('[data-mic-status]').innerText();if(!stopped.includes('麦克风已关闭'))item.pageErrors.push('Sound topography microphone stop failed: '+stopped)}
                }
                if(width===1440 && route==='experiment-water.html'){
                  await page.locator('[data-breath] button').click();
                  const breath=await page.locator('.breath-orb').evaluate(el=>el.classList.contains('active'));
                  const label=await page.locator('[data-breath-label]').innerText();
                  await page.locator('[data-breath] button').click();
                  await page.locator('[data-water-tone]').first().click();
                  const tone=await page.locator('[data-play-canvas]').getAttribute('data-current-tone');
                  if(!breath||!label.includes('吸气')||tone!=='#8fd8cd')item.pageErrors.push('Water experiment controls failed');
                }
                if(width===1440||width===390){
                  await page.evaluate(async()=>{
                    for(const img of document.images){img.loading='eager';try{await img.decode()}catch{}}
                    document.documentElement.style.scrollBehavior='auto';window.scrollTo(0,document.body.scrollHeight);await new Promise(r=>setTimeout(r,250));window.scrollTo(0,0);await new Promise(r=>setTimeout(r,80));
                  });
                  await page.screenshot({path:'live-audit/screenshots/'+route.replace('.html','')+'-'+width+'.png',fullPage:true,animations:'disabled'});
                }
                if(width===390){
                  const menu=page.locator('.menu-button').first();
                  if(await menu.count()){
                    const before=await menu.getAttribute('aria-expanded');
                    await menu.click();
                    const opened=await page.locator('.menu-button').first().getAttribute('aria-expanded');
                    const visibleAfterOpen=await page.locator('.nav').isVisible();
                    await page.locator('.menu-button').first().click();
                    const closed=await page.locator('.menu-button').first().getAttribute('aria-expanded');
                    const hiddenAfterClose=!(await page.locator('.nav').isVisible());
                    item.mobileMenu={before,opened,visibleAfterOpen,closed,hiddenAfterClose,passed:before==='false'&&opened==='true'&&visibleAfterOpen&&closed==='false'&&hiddenAfterClose};
                  }
                }
                if(width===1440){
                  const hrefs=await page.locator('a[href]').evaluateAll(as=>as.map(a=>a.getAttribute('href')).filter(Boolean));
                  for(const href of new Set(hrefs)){
                    if(/^(mailto:|tel:|javascript:|data:)/i.test(href))continue;
                    let target;try{target=new URL(href,new URL(route,base))}catch{continue}
                    if(target.origin!==new URL(base).origin)continue;
                    const path=target.pathname.endsWith('/')?target.pathname+'index.html':target.pathname;
                    const checkUrl=target.origin+path;
                    if(checkedLinks.has(checkUrl))continue;
                    checkedLinks.add(checkUrl);
                    const res=await page.request.get(checkUrl,{timeout:5000}).catch(()=>null);
                    if(!res||!res.ok())report.brokenLinks.push({from:route,href,status:res?.status()??'request failed'});
                    else if(target.hash){
                      const html=await res.text(),id=decodeURIComponent(target.hash.slice(1));
                      if(!html.includes('id="'+id+'"')&&!html.includes("id='"+id+"'")&&!html.includes('name="'+id+'"'))report.brokenLinks.push({from:route,href,status:'missing anchor'});
                    }
                  }
                }
              }catch(e){item.pageErrors.push('viewport '+width+': '+String(e))}
            }
            if(route==='index.html'){
              for(const viewport of [{width:1440,height:900},{width:1512,height:982}]){
                await page.setViewportSize(viewport);
                await page.goto(new URL(route,base).href,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForTimeout(900);
                const home=await page.evaluate(()=>{
                  const rect=s=>{const e=document.querySelector(s);if(!e)return null;const r=e.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right}};
                  const tag=rect('.home-tagline'),category=rect('.onething .category'),map=rect('.star-map'),hint=rect('.home-hint');
                  const nodes=[...document.querySelectorAll('.star-node')].map(n=>({id:n.dataset.starRoom,color:getComputedStyle(n.querySelector('.core')).fill,labelColor:getComputedStyle(n.querySelector('.node-label')).fill,labelSize:parseFloat(getComputedStyle(n.querySelector('.node-label')).fontSize),sparkle:!!n.querySelector('.sparkle'),delay:getComputedStyle(n.querySelector('.core')).animationDelay}));
                  return {width:innerWidth,height:innerHeight,pageHeight:document.documentElement.scrollHeight,tag,category,taglineCategoryGap:tag&&category?category.top-tag.bottom:null,dateVisible:!!document.querySelector('.onething-date'),map,hint,nodes};
                });
                if(home.pageHeight>viewport.height+1)item.pageErrors.push('Desktop homepage does not fit one viewport at '+viewport.width+'x'+viewport.height+': '+home.pageHeight+'px');
                if(!home.tag||!home.category||home.taglineCategoryGap<12)item.pageErrors.push('Desktop tagline and ONETHING category overlap or lack spacing at '+viewport.width+'px: '+JSON.stringify(home.taglineCategoryGap));
                if(home.dateVisible)item.pageErrors.push('Homepage date row must not be rendered');
                if(!home.map||!home.hint||home.map.top<0||home.map.bottom>viewport.height||home.hint.top<0||home.hint.bottom>viewport.height)item.pageErrors.push('Desktop star map or TOUCH THE WATER hint is outside the viewport at '+viewport.width+'px');
                if(home.nodes.length!==5||new Set(home.nodes.map(n=>n.color)).size!==5||home.nodes.some(n=>!n.sparkle||n.labelSize<12||n.labelColor==='rgb(168, 189, 192)'))item.pageErrors.push('Desktop star-map nodes need five distinct colors, sparkles and clear labels: '+JSON.stringify(home.nodes));
                await page.emulateMedia({reducedMotion:'reduce'});
                const reduced=await page.locator('.star-node .core').first().evaluate(el=>parseFloat(getComputedStyle(el).animationDuration));
                if(reduced>.001)item.pageErrors.push('Star-map pulse does not respect reduced-motion at '+viewport.width+'px');
                await page.emulateMedia({reducedMotion:'no-preference'});
              }
            }
            await page.close();report.routes.push(item);
          }
          await browser.close();
          const flat=report.routes.flatMap(r=>r.viewports);
          report.summary={
            routeCount:report.routes.length,viewportChecks:flat.length,
            badHttp:report.routes.filter(r=>!r.status||r.status>=400).map(r=>({route:r.route,status:r.status})),
            pageErrors:report.routes.reduce((n,r)=>n+r.pageErrors.length,0),
            consoleErrors:report.routes.reduce((n,r)=>n+r.consoleErrors.length,0),
            failedRequests:report.routes.reduce((n,r)=>n+r.failedRequests.length,0),
            brokenLinks:report.brokenLinks.length,
            horizontalOverflow:flat.filter(v=>v.horizontalOverflow).map(v=>({route:report.routes.find(r=>r.viewports.includes(v))?.route,width:v.width})),
            imageFailures:flat.reduce((n,v)=>n+v.imageFailures.length,0),
            mobileMenuFailures:report.routes.filter(r=>r.mobileMenu&&!r.mobileMenu.passed).map(r=>r.route),
            sitemapMatchesRoutes:report.sitemap.status===200&&report.sitemap.urls.length===routes.length&&routes.every(r=>report.sitemap.urls.includes(r==='index.html'?base:new URL(r,base).href)),
            externalFontRequests:report.routes.reduce((n,r)=>n+r.viewports.reduce((m,v)=>m+(v.fontRequests?.length||0),0),0),
            contentPolicyErrors:report.routes.reduce((n,r)=>n+r.pageErrors.filter(e=>/Forbidden brand or price text detected/.test(e)).length,0),
            homeFitsSingleViewport:report.deployment.pageHeight<=report.deployment.viewportHeight+1,
            homepageHasOneH1:report.deployment.h1===1
          };
          fs.writeFileSync('live-audit/report.json',JSON.stringify(report,null,2));
          fs.writeFileSync(process.env.GITHUB_STEP_SUMMARY,[
            '# NORVA production website audit',
            '',
            'Target: '+base,
            'Homepage title: '+report.deployment.title,
            'Homepage height: '+report.deployment.pageHeight+'px / viewport '+report.deployment.viewportHeight+'px',
            '',
            '## Summary',
            '```json',
            JSON.stringify(report.summary,null,2),
            '```',
            '',
            'Full route-by-route results and screenshots are attached as workflow artifacts.'
          ].join('\n'));
          console.log(JSON.stringify({deployment:report.deployment,summary:report.summary},null,2));
          const s=report.summary;
          if(!report.deployment.status||report.deployment.status>=400||s.badHttp.length||s.pageErrors||s.consoleErrors||s.failedRequests||s.brokenLinks||s.horizontalOverflow.length||s.imageFailures||s.mobileMenuFailures.length||s.externalFontRequests||s.contentPolicyErrors||!s.homeFitsSingleViewport||!s.homepageHasOneH1||!s.sitemapMatchesRoutes)process.exitCode=1;
          EOF
          node live-audit.mjs
      - name: Upload live audit report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: norva-production-live-audit
          path: live-audit/
          if-no-files-found: warn
