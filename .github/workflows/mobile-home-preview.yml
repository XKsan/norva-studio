name: Mobile home visual preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'world.css'
      - 'world.js'
      - '.github/workflows/mobile-home-preview.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify 390px mobile Chrome-style document scrolling
        run: |
          python3 -m http.server 4173 >/tmp/norva-preview-server.log 2>&1 &
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:651},deviceScaleFactor:1,isMobile:false,hasTouch:true,reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.waitForTimeout(1200);
          const before = await page.evaluate(() => ({
            viewport:{width:innerWidth,height:innerHeight},
            documentHeight:document.documentElement.scrollHeight,
            bodyHeight:document.body.scrollHeight,
            bodyOverflow:getComputedStyle(document.body).overflowY,
            waterOverflow:getComputedStyle(document.querySelector('.home-water')).overflow,
            category:document.querySelector('.onething .category').getBoundingClientRect().toJSON(),
            tagline:document.querySelector('.home-tagline').getBoundingClientRect().toJSON(),
            meaning:document.querySelector('.onething .meaning:last-child').getBoundingClientRect().toJSON(),
            map:document.querySelector('.star-map').getBoundingClientRect().toJSON()
          }));
          await page.screenshot({path:'mobile-home-390-full.png',fullPage:true});
          await page.evaluate(() => window.scrollTo(0,document.documentElement.scrollHeight));
          await page.waitForTimeout(250);
          const after = await page.evaluate(() => {
            const r=document.querySelector('.home-hint').getBoundingClientRect();
            return {scrollY,scrollHeight:document.documentElement.scrollHeight,clientHeight:document.documentElement.clientHeight,hint:{top:r.top,bottom:r.bottom},hintVisible:r.bottom>0&&r.top<innerHeight,scrollbarNeeded:document.documentElement.scrollHeight>document.documentElement.clientHeight};
          });
          await page.screenshot({path:'mobile-home-390-bottom.png'});
          console.log(JSON.stringify({before,after},null,2));
          if(before.documentHeight<=before.viewport.height || before.bodyOverflow==='hidden' || before.waterOverflow==='hidden' || before.category.top<before.tagline.bottom || before.map.top<before.meaning.bottom || after.scrollY<=0 || !after.hintVisible || !after.scrollbarNeeded) process.exitCode=1;
          const js=readFileSync('world.js','utf8');
          if(!/noiseFilter\.frequency\.value=1200/.test(js)||!/setTargetAtTime\(\.2,audio\.currentTime,\.25\)/.test(js)) { console.error('Water audio gain/filter settings not updated'); process.exitCode=1; }
          await browser.close();
          EOF
      - name: Upload mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: norva-mobile-home-390-scroll-preview
          path: |
            mobile-home-390-full.png
            mobile-home-390-bottom.png
          if-no-files-found: error
