name: Mobile home visual preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'world.css'
      - 'world.js'
      - '.github/workflows/mobile-home-preview.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture actual 390px homepage
        run: |
          python3 -m http.server 4173 >/tmp/norva-preview-server.log 2>&1 &
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({viewport:{width:390,height:844},deviceScaleFactor:1,reducedMotion:'reduce'});
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.waitForTimeout(1200);
          await page.screenshot({path:'mobile-home-390.png',fullPage:true});
          const result = await page.evaluate(() => {
            const rect = s => { const e=document.querySelector(s); const r=e.getBoundingClientRect(); return {top:Math.round(r.top),bottom:Math.round(r.bottom),left:Math.round(r.left),right:Math.round(r.right),height:Math.round(r.height)}; };
            const mark=rect('.home-mark'), one=rect('.onething'), category=rect('.onething .category'), tagline=rect('.home-tagline'), map=rect('.star-map'), meaning=rect('.onething .meaning:last-child');
            return {viewport:{width:innerWidth,height:innerHeight},documentHeight:document.documentElement.scrollHeight,mark,tagline,category,one,meaning,map,taglineCategoryGap:Math.round(category.top-tagline.bottom),meaningMapGap:Math.round(map.top-meaning.bottom),overlapTaglineCategory:category.top<tagline.bottom,overlapMeaningMap:map.top<meaning.bottom};
          });
          console.log(JSON.stringify(result,null,2));
          if(result.overlapTaglineCategory || result.overlapMeaningMap || result.taglineCategoryGap<16 || result.meaningMapGap<24) process.exitCode=1;
          await browser.close();
          EOF
      - name: Upload 390px screenshot
        uses: actions/upload-artifact@v4
        with:
          name: norva-mobile-home-390-preview
          path: mobile-home-390.png
          if-no-files-found: error
