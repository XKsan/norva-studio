name: Mobile home visual preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'world.css'
      - 'world.js'
      - '.github/workflows/mobile-home-preview.yml'
permissions:
  contents: read
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify 390px mobile Chrome-style document scrolling
        run: |
          python3 -m http.server 4173 >/tmp/norva-preview-server.log 2>&1 &
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          import { readFileSync } from 'node:fs';
          const browser = await chromium.launch({headless:true});
          const desktop=await browser.newPage({viewport:{width:1440,height:900},deviceScaleFactor:1});
          await desktop.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await desktop.waitForTimeout(1200);
          for(const viewport of [{width:1440,height:900},{width:1512,height:982}]){
            await desktop.setViewportSize(viewport);
            await desktop.waitForTimeout(150);
            const s=await desktop.evaluate(()=>({
              pageHeight:document.documentElement.scrollHeight,
              tagline:document.querySelector('.home-tagline').getBoundingClientRect().toJSON(),
              category:document.querySelector('.onething .category').getBoundingClientRect().toJSON(),
              map:document.querySelector('.star-map').getBoundingClientRect().toJSON(),
              hint:document.querySelector('.home-hint').getBoundingClientRect().toJSON(),
              date:!!document.querySelector('.onething-date'),
              nodes:[...document.querySelectorAll('.star-node')].map(n=>({
                id:n.dataset.starRoom,color:getComputedStyle(n.querySelector('.core')).fill,
                labelSize:parseFloat(getComputedStyle(n.querySelector('.node-label')).fontSize),
                sparkle:!!n.querySelector('.sparkle'),delay:getComputedStyle(n.querySelector('.core')).animationDelay,
                href:n.closest('a')?.getAttribute('href')
              })),
              connector:document.querySelector('.star-map svg path')?.getAttribute('d')
            }));
            console.log('DESKTOP '+viewport.width+'x'+viewport.height,JSON.stringify(s,null,2));
            if(s.pageHeight>viewport.height+1)throw new Error('Desktop homepage scrolls at '+viewport.width+'x'+viewport.height);
            if(s.category.top-s.tagline.bottom<12)throw new Error('Tagline/category overlap at '+viewport.width);
            if(s.date)throw new Error('Homepage date row still rendered');
            if(!s.map||!s.hint||s.map.top<0||s.map.bottom>viewport.height||s.hint.top<0||s.hint.bottom>viewport.height)throw new Error('Star map or bottom hint clipped');
            if(s.nodes.length!==5||new Set(s.nodes.map(n=>n.color)).size!==5)throw new Error('Five distinct node colors missing');
            if(s.nodes.some(n=>!n.sparkle||n.labelSize<12||!n.href))throw new Error('Star sparkle/menu label/link missing');
            if(new Set(s.nodes.map(n=>n.delay)).size!==5)throw new Error('Star pulses are not staggered');
            if(!s.connector)throw new Error('Star-map connector line missing');
            await desktop.screenshot({path:'desktop-home-'+viewport.width+'.png',fullPage:true});
            await desktop.emulateMedia({reducedMotion:'reduce'});
            const duration=await desktop.locator('.star-node .core').first().evaluate(el=>parseFloat(getComputedStyle(el).animationDuration));
            if(duration>.001)throw new Error('Reduced-motion preference not respected');
            await desktop.emulateMedia({reducedMotion:'no-preference'});
          }
          await desktop.close();
          const page = await browser.newPage({viewport:{width:390,height:651},deviceScaleFactor:1,isMobile:false,hasTouch:true,reducedMotion:'no-preference'});
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.waitForTimeout(1200);
          const before = await page.evaluate(() => ({
            viewport:{width:innerWidth,height:innerHeight},
            documentHeight:document.documentElement.scrollHeight,
            bodyHeight:document.body.scrollHeight,
            bodyOverflow:getComputedStyle(document.body).overflowY,
            waterOverflow:getComputedStyle(document.querySelector('.home-water')).overflow,
            category:document.querySelector('.onething .category').getBoundingClientRect().toJSON(),
            tagline:document.querySelector('.home-tagline').getBoundingClientRect().toJSON(),
            meaning:document.querySelector('.onething .meaning:last-child').getBoundingClientRect().toJSON(),
            map:document.querySelector('.star-map').getBoundingClientRect().toJSON(),
            sparkleDisplay:getComputedStyle(document.querySelector('.star-node .sparkle')).display,
            sparkleDuration:getComputedStyle(document.querySelector('.star-node .sparkle')).animationDuration,
            sparkleDelay:getComputedStyle(document.querySelector('.star-node .sparkle')).animationDelay,
            labelSize:parseFloat(getComputedStyle(document.querySelector('.star-node .node-label')).fontSize)
          }));
          await page.screenshot({path:'mobile-home-390-full.png',fullPage:true});
          await page.evaluate(() => window.scrollTo(0,document.documentElement.scrollHeight));
          await page.waitForTimeout(250);
          const after = await page.evaluate(() => {
            const r=document.querySelector('.home-hint').getBoundingClientRect();
            return {scrollY,scrollHeight:document.documentElement.scrollHeight,clientHeight:document.documentElement.clientHeight,hint:{top:r.top,bottom:r.bottom},hintVisible:r.bottom>0&&r.top<innerHeight,scrollbarNeeded:document.documentElement.scrollHeight>document.documentElement.clientHeight};
          });
          await page.screenshot({path:'mobile-home-390-bottom.png'});
          console.log(JSON.stringify({before,after},null,2));
          if(before.documentHeight<=before.viewport.height || before.bodyOverflow==='hidden' || before.waterOverflow==='hidden' || before.category.top<before.tagline.bottom || before.map.top<before.meaning.bottom || before.sparkleDisplay==='none' || before.sparkleDuration!=='8.4s' || before.sparkleDelay!=='0s' || before.labelSize!==22 || after.scrollY<=0 || !after.hintVisible || !after.scrollbarNeeded) process.exitCode=1;
          const js=readFileSync('world.js','utf8');
          if(!/noiseFilter\.frequency\.value=1200/.test(js)||!/setTargetAtTime\(\.2,audio\.currentTime,\.25\)/.test(js)) { console.error('Water audio gain/filter settings not updated'); process.exitCode=1; }
          await browser.close();
          EOF
      - name: Upload mobile screenshots
        uses: actions/upload-artifact@v4
        with:
          name: norva-mobile-home-390-scroll-preview
          path: |
            mobile-home-390-full.png
            mobile-home-390-bottom.png
            desktop-home-1440.png
            desktop-home-1512.png
          if-no-files-found: error
