name: Desktop homepage responsive preview
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'world.css'
      - 'world.js'
      - '.github/workflows/desktop-home-preview.yml'
permissions:
  contents: read
jobs:
  desktop-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify desktop composition and unchanged mobile flow
        run: |
          python3 -m http.server 4173 >/tmp/norva-preview-server.log 2>&1 &
          node --input-type=module <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({deviceScaleFactor:1});
          await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'networkidle'});
          await page.waitForTimeout(1200);
          for(const viewport of [{width:1440,height:900},{width:1512,height:982}]){
            await page.setViewportSize(viewport);
            await page.waitForTimeout(150);
            const s=await page.evaluate(()=>({
              viewport:{width:innerWidth,height:innerHeight},
              pageHeight:document.documentElement.scrollHeight,
              mark:document.querySelector('.home-mark').getBoundingClientRect().toJSON(),
              tagline:document.querySelector('.home-tagline').getBoundingClientRect().toJSON(),
              category:document.querySelector('.onething .category').getBoundingClientRect().toJSON(),
              map:document.querySelector('.star-map').getBoundingClientRect().toJSON(),
              hint:document.querySelector('.home-hint').getBoundingClientRect().toJSON(),
              date:!!document.querySelector('.onething-date'),
              nodes:[...document.querySelectorAll('.star-node')].map(n=>({
                id:n.dataset.starRoom,
                color:getComputedStyle(n.querySelector('.core')).fill,
                label:n.querySelector('.node-label')?.textContent.trim(),
                labelSize:parseFloat(getComputedStyle(n.querySelector('.node-label')).fontSize),
                labelColor:getComputedStyle(n.querySelector('.node-label')).fill,
                sparkle:!!n.querySelector('.sparkle'),
                delay:getComputedStyle(n.querySelector('.core')).animationDelay,
                href:n.closest('a')?.getAttribute('href')
              })),
              connector:document.querySelector('.star-map svg path')?.getAttribute('d')
            }));
            console.log(JSON.stringify(s,null,2));
            if(s.pageHeight>viewport.height+1)throw new Error('Desktop homepage scrolls at '+viewport.width+'x'+viewport.height);
            if(s.category.top-s.tagline.bottom<12)throw new Error('Tagline and ONETHING category overlap at '+viewport.width);
            if(s.date)throw new Error('Homepage date row is still rendered');
            if(s.map.top<0||s.map.bottom>viewport.height||s.hint.top<0||s.hint.bottom>viewport.height)throw new Error('Star map or bottom hint is clipped');
            if(s.nodes.length!==5||new Set(s.nodes.map(n=>n.color)).size!==5)throw new Error('Star-map nodes do not have five distinct colors');
            if(s.nodes.some(n=>!n.sparkle||n.labelSize<12||!n.labelColor||!n.href))throw new Error('Star-map sparkle, label visibility or link missing');
            if(new Set(s.nodes.map(n=>n.delay)).size!==5)throw new Error('Star-map pulses are not staggered');
            if(!s.connector)throw new Error('Star-map connector line missing');
            await page.screenshot({path:'desktop-home-'+viewport.width+'.png',fullPage:true});
            await page.emulateMedia({reducedMotion:'reduce'});
            const duration=await page.locator('.star-node .core').first().evaluate(el=>parseFloat(getComputedStyle(el).animationDuration));
            if(duration>.001)throw new Error('Reduced-motion preference is not respected');
            await page.emulateMedia({reducedMotion:'no-preference'});
          }
          await page.setViewportSize({width:390,height:651});
          await page.waitForTimeout(150);
          const mobile=await page.evaluate(()=>({
            viewport:{width:innerWidth,height:innerHeight},
            pageHeight:document.documentElement.scrollHeight,
            homeOverflow:getComputedStyle(document.querySelector('.home-screen')).overflow,
            waterOverflow:getComputedStyle(document.querySelector('.home-water')).overflow,
            markPosition:getComputedStyle(document.querySelector('.home-mark')).position,
            markTop:getComputedStyle(document.querySelector('.home-mark')).top,
            hintPosition:getComputedStyle(document.querySelector('.home-hint')).position
          }));
          console.log('MOBILE',JSON.stringify(mobile,null,2));
          if(mobile.pageHeight<=mobile.viewport.height||mobile.homeOverflow!=='visible'||mobile.waterOverflow!=='visible'||mobile.markPosition!=='relative'||mobile.hintPosition!=='relative')throw new Error('Mobile natural scrolling/layout changed');
          await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight));
          await page.waitForTimeout(150);
          const hint=await page.locator('.home-hint').evaluate(el=>{const r=el.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight});
          if(!hint)throw new Error('Mobile bottom hint is not reachable');
          await page.screenshot({path:'mobile-home-390-bottom.png'});
          await browser.close();
          EOF
      - name: Upload desktop and mobile previews
        uses: actions/upload-artifact@v4
        with:
          name: norva-desktop-homepage-preview
          path: |
            desktop-home-1440.png
            desktop-home-1512.png
            mobile-home-390-bottom.png
          if-no-files-found: error
